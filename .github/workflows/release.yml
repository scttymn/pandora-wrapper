name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v0.1.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Validate version and release notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import secrets
          import subprocess
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit(f'Expected a version tag such as v0.1.4, got {tag!r}')
          version = tag[1:]
          for name in ('package.json', 'package-lock.json', 'src-tauri/tauri.conf.json'):
              if json.loads(Path(name).read_text())['version'] != version:
                  raise SystemExit(f'{name} does not match {tag}')
          manifest = Path('src-tauri/Cargo.toml').read_text()
          if re.search(r'^version = "([^"]+)"', manifest, re.M)[1] != version:
              raise SystemExit(f'Cargo.toml does not match {tag}')
          lock = Path('src-tauri/Cargo.lock').read_text()
          if f'name = "pandora-wrapper"\nversion = "{version}"' not in lock:
              raise SystemExit(f'Cargo.lock does not match {tag}')
          notes = Path(f'docs/releases/{tag}.md').read_text().strip()
          if not notes:
              raise SystemExit('Release notes must not be empty')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          delimiter = secrets.token_hex(16)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ncommit={commit}\nnotes<<{delimiter}\n{notes}\n{delimiter}\n')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Configure ad-hoc macOS signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: Pandora Wrapper ${{ needs.validate.outputs.tag }}
          releaseBody: ${{ needs.validate.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
